<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DENTIVA | Premium Dental Clinic Website Template</title>
    <meta name="description" content="A modern dental clinic website template featuring dental treatments, specialist profiles, appointment booking and patient education." />
    <meta name="keywords" content="dental clinic, dentist, oral care, dental implants, teeth whitening, orthodontics, cosmetic dentistry" />
    <meta property="og:title" content="DENTIVA | Premium Dental Clinic Website Template" />
    <meta property="og:description" content="A modern dental clinic website template featuring dental treatments, specialist profiles, appointment booking and patient education." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Immediate Theme Application Script (defaults to Light mode) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dentiva-theme-preference');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#fcfdfd] text-navy-900 dark:bg-dark-bg dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
